<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 产品实验室</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 自定义动画 */
        .project-card {
            transition: all 0.3s ease;
        }
        
        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        /* 渐变背景 */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header 区域 -->
    <header class="gradient-bg text-white py-20 px-4">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-4xl md:text-6xl font-bold mb-6">
                <i class="fas fa-rocket mr-3"></i>我的 AI 实验室
            </h1>
            <p class="text-lg md:text-xl opacity-90 max-w-2xl mx-auto">
                利用 AI 赋能开发，探索技术边界。这里汇聚了我的各种 AI 作品，展示人工智能在不同领域的应用与创新。
            </p>
        </div>
    </header>
    
    <!-- 项目网格区域 -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">
            <i class="fas fa-flask mr-2 text-purple-600"></i>项目展示
        </h2>
        
        <!-- 
            ========================================
            🔥 新增项目卡片区域 - 请在此处添加更多项目
            ========================================
            复制下方的 <a> 标签块，修改以下内容：
            1. href="你的项目链接"
            2. src="你的封面图链接"（或继续使用占位图）
            3. 项目名称
            4. 项目描述
            ========================================
        -->
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- 项目卡片 1 - 英语单词闯关游戏 -->
            <a href="projects/english-game/index.html" class="project-card bg-white rounded-lg overflow-hidden shadow-lg block">
                <img src="https://placehold.co/600x400/667eea/white?text=English+Game" 
                     alt="项目封面" 
                     class="w-full h-48 object-cover">
                <div class="p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-2">
                        <i class="fas fa-gamepad text-purple-600 mr-2"></i>英语单词闯关游戏
                    </h3>
                    <!-- 核心功能标签 -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">#英语学习</span>
                        <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm">#单词背记</span>
                        <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm">#游戏化学习</span>
                    </div>
                    <p class="text-gray-600 mb-6">
                        单词背记闯关游戏，支持中英文互译，自动记录最高分，游戏化学习更有趣。
                    </p>
                    <!-- 进入体验按钮 -->
                    <button class="gradient-bg text-white px-4 py-2 rounded-lg hover:opacity-90 transition duration-300 w-full">
                        <i class="fas fa-rocket mr-2"></i>进入体验
                    </button>
                </div>
            </a>
            
            <!-- 
                ========================================
                在此处继续添加更多项目卡片...
                ========================================
            -->
            
        </div>
    </main>
    
    <!-- Footer 区域 -->
    <footer class="bg-gray-800 text-white py-8 mt-16">
        <div class="max-w-6xl mx-auto text-center px-4">
            <p class="text-gray-400">
                <i class="fas fa-code mr-2"></i>
                Made with <i class="fas fa-heart text-red-500 mx-1"></i> by AI Product Lab
            </p>
            <p class="text-gray-500 text-sm mt-2">
                © 2025 我的 AI 产品实验室. All rights reserved.
            </p>
        </div>
    </footer>
    
</body>
</html>
