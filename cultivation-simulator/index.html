<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修仙宗门模拟器</title>
  <style>
    /* 全局样式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
    }

    .app {
      min-height: 100vh;
      padding: 20px;
    }

    /* 游戏主样式 */
    .game-main {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ddd;
    }

    .game-title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin: 0;
    }

    .game-controls {
      display: flex;
      gap: 10px;
    }

    .game-content {
      display: grid;
      grid-template-columns: 300px 1fr 350px;
      gap: 20px;
    }

    .panel {
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 0 0 15px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 按钮样式 */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }

    .btn-primary:hover {
      background-color: #45a049;
    }

    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #0b7dda;
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 12px;
    }

    /* 资源样式 */
    .resources {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .resource-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background-color: #f9f9f9;
      border-radius: 4px;
    }

    .resource-label {
      font-weight: bold;
      color: #555;
    }

    .resource-value {
      font-weight: bold;
      color: #4CAF50;
    }

    /* 掌门信息样式 */
    .leader-info {
      text-align: center;
    }

    .leader-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .leader-realm {
      font-size: 16px;
      color: #666;
      margin-bottom: 10px;
    }

    .xp-bar-container {
      position: relative;
      height: 20px;
      background-color: #f0f0f0;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .xp-bar {
      height: 100%;
      background-color: #4CAF50;
      transition: width 0.5s ease;
    }

    .xp-text {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      line-height: 20px;
    }

    /* 弟子列表样式 */
    .disciples-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .disciple-item {
      background-color: #f9f9f9;
      border-radius: 6px;
      padding: 12px;
      border: 1px solid #eee;
    }

    .disciple-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .disciple-name {
      font-weight: bold;
      color: #333;
      font-size: 16px;
    }

    .disciple-state {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      background-color: #4CAF50;
      color: white;
    }

    .disciple-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-label {
      width: 40px;
      font-size: 14px;
      color: #555;
    }

    .stat-value {
      font-weight: bold;
      color: #333;
    }

    .mood-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mood-bar {
      height: 8px;
      background-color: #4CAF50;
      border-radius: 4px;
      transition: width 0.3s ease;
      flex: 1;
    }

    .disciple-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* 邮件系统样式 */
    .mailbox {
      max-height: 300px;
      overflow-y: auto;
    }

    .mail-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .mail-item:hover {
      background-color: #f5f5f5;
    }

    .mail-unread {
      background-color: #e3f2fd;
      font-weight: bold;
    }

    .mail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .mail-title {
      font-weight: bold;
      color: #333;
    }

    .mail-time {
      font-size: 12px;
      color: #888;
    }

    .mail-content {
      font-size: 14px;
      color: #555;
      padding: 10px 0;
      border-top: 1px dashed #ddd;
      margin-top: 5px;
    }

    .mail-badge {
      background-color: #ff5722;
      color: white;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    .empty-message {
      text-align: center;
      color: #888;
      padding: 20px;
      font-style: italic;
    }

    /* 日志样式 */
    .logs-container {
      max-height: 200px;
      overflow-y: auto;
      background-color: #f9f9f9;
      border-radius: 4px;
      padding: 10px;
    }

    .log-item {
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
    }

    .log-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    /* 响应式设计 */
    @media (max-width: 1024px) {
      .game-content {
        grid-template-columns: 1fr 1fr;
      }
      
      .right-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      .game-content {
        grid-template-columns: 1fr;
      }
      
      .game-header {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }
      
      .game-controls {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="game-main">
      <div class="game-header">
        <h1 class="game-title">修仙宗门模拟器</h1>
        <div class="game-controls">
          <button class="btn btn-primary" onclick="handleNextTick()">下一回合</button>
          <button class="btn btn-secondary" onclick="handleStartGame()">重新开始</button>
        </div>
      </div>

      <div class="game-content">
        <!-- 左侧面板：资源和掌门信息 -->
        <div class="left-panel">
          <!-- 资源显示 -->
          <div class="panel">
            <h2 class="panel-title">宗门资源</h2>
            <div class="resources">
              <div class="resource-item">
                <span class="resource-label">灵石:</span>
                <span class="resource-value" id="spirit-stones">1000</span>
              </div>
              <div class="resource-item">
                <span class="resource-label">气运:</span>
                <span class="resource-value" id="fate">100</span>
              </div>
            </div>
          </div>

          <!-- 掌门信息 -->
          <div class="panel">
            <h2 class="panel-title">掌门信息</h2>
            <div class="leader-info">
              <div class="leader-name" id="leader-name">掌教真人</div>
              <div class="leader-realm" id="leader-realm">练气一层</div>
              <div class="xp-bar-container">
                <div class="xp-bar" id="xp-bar" style="width: 0%"></div>
                <div class="xp-text" id="xp-text">0 / 100 修为</div>
              </div>
              <button class="btn btn-primary mt-2" onclick="handleLeaderCultivate()">开始修行</button>
            </div>
          </div>
        </div>

        <!-- 中间面板：弟子管理 -->
        <div class="center-panel">
          <div class="panel">
            <h2 class="panel-title">弟子管理</h2>
            <div class="disciples-list" id="disciples-list">
              <!-- 弟子列表将通过JavaScript动态生成 -->
            </div>
          </div>
        </div>

        <!-- 右侧面板：邮件和日志 -->
        <div class="right-panel">
          <!-- 邮件系统 -->
          <div class="panel">
            <h2 class="panel-title">
              宗门邮件
              <span id="mail-badge" class="mail-badge" style="display: none">0</span>
            </h2>
            <div class="mailbox" id="mailbox">
              <div class="empty-message">暂无邮件</div>
            </div>
          </div>

          <!-- 日志系统 -->
          <div class="panel">
            <h2 class="panel-title">宗门日志</h2>
            <div class="logs-container" id="logs-container">
              <div class="log-item">宗门建立，开始修仙之旅！</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 游戏配置
    const GAME_CONFIG = {
      INITIAL_RESOURCES: {
        spiritStones: 1000,
        fate: 100
      },
      INITIAL_LEADER: {
        name: '掌教真人',
        realm: '练气一层',
        xp: 0,
        maxXp: 100
      },
      INITIAL_DISCIPLES_COUNT: 3,
      DISCIPLE_WORK_OUTPUT: {
        spiritStones: 10,
        moodDecrease: 5
      },
      LEADER_CULTIVATE_COST: {
        fate: 20
      },
      LEADER_CULTIVATE_GAIN: {
        xp: 30
      },
      MOOD_THRESHOLDS: {
        DERANGED: 20
      },
      EXPLORATION: {
        DURATION: 5,
        MOOD_INCREASE: 15,
        SPIRIT_STONES_REWARD: [50, 200],
        STORY_COOLDOWN: 10
      }
    };

    const REALMS = [
      '练气一层', '练气二层', '练气三层',
      '筑基一层', '筑基二层', '筑基三层',
      '金丹一层', '金丹二层', '金丹三层',
      '元婴一层', '元婴二层', '元婴三层',
      '化神一层', '化神二层', '化神三层'
    ];

    // 游戏状态
    let gameState = {
      tickCount: 0,
      resources: { ...GAME_CONFIG.INITIAL_RESOURCES },
      leader: { ...GAME_CONFIG.INITIAL_LEADER },
      disciples: [],
      mailbox: [],
      logs: ['宗门建立，开始修仙之旅！']
    };

    // 初始化弟子
    function initDisciples() {
      const discipleNames = ['弟子甲', '弟子乙', '弟子丙'];
      gameState.disciples = [];
      for (let i = 0; i < GAME_CONFIG.INITIAL_DISCIPLES_COUNT; i++) {
        gameState.disciples.push({
          id: i + 1,
          name: discipleNames[i],
          state: 'IDLE',
          mood: 80,
          talent: Math.floor(Math.random() * 50) + 50
        });
      }
    }

    // 状态文本映射
    const stateTextMap = {
      'IDLE': '空闲',
      'WORKING': '工作中',
      'DERANGED': '走火入魔',
      'EXPLORING': '历练中'
    };

    // 更新UI
    function updateUI() {
      // 更新资源
      document.getElementById('spirit-stones').textContent = gameState.resources.spiritStones;
      document.getElementById('fate').textContent = gameState.resources.fate;

      // 更新掌门信息
      document.getElementById('leader-name').textContent = gameState.leader.name;
      document.getElementById('leader-realm').textContent = gameState.leader.realm;
      const xpPercentage = (gameState.leader.xp / gameState.leader.maxXp) * 100;
      document.getElementById('xp-bar').style.width = `${xpPercentage}%`;
      document.getElementById('xp-text').textContent = `${gameState.leader.xp} / ${gameState.leader.maxXp} 修为`;

      // 更新弟子列表
      updateDisciplesList();

      // 更新邮件
      updateMailbox();

      // 更新日志
      updateLogs();
    }

    // 更新弟子列表
    function updateDisciplesList() {
      const container = document.getElementById('disciples-list');
      container.innerHTML = '';

      gameState.disciples.forEach(disciple => {
        const discipleElement = document.createElement('div');
        discipleElement.className = 'disciple-item';
        discipleElement.innerHTML = `
          <div class="disciple-header">
            <div class="disciple-name">${disciple.name}</div>
            <div class="disciple-state">${stateTextMap[disciple.state]}</div>
          </div>
          <div class="disciple-stats">
            <div class="stat-item">
              <span class="stat-label">心情:</span>
              <div class="mood-bar-container">
                <div class="mood-bar" style="width: ${disciple.mood}%"></div>
                <span class="stat-value">${disciple.mood}</span>
              </div>
            </div>
            <div class="stat-item">
              <span class="stat-label">资质:</span>
              <span class="stat-value">${disciple.talent}</span>
            </div>
          </div>
          <div class="disciple-actions">
            <button class="btn btn-small btn-secondary" onclick="handleAssignWork(${disciple.id})" ${disciple.state === 'WORKING' || disciple.state === 'DERANGED' ? 'disabled' : ''}>
              安排工作
            </button>
            <button class="btn btn-small btn-primary" onclick="handleSendExplore(${disciple.id})" ${disciple.state === 'EXPLORING' || disciple.state === 'DERANGED' ? 'disabled' : ''}>
              派遣历练
            </button>
          </div>
        `;
        container.appendChild(discipleElement);
      });
    }

    // 更新邮件
    function updateMailbox() {
      const container = document.getElementById('mailbox');
      const badge = document.getElementById('mail-badge');
      const unreadCount = gameState.mailbox.filter(mail => !mail.read).length;

      if (unreadCount > 0) {
        badge.textContent = unreadCount;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }

      if (gameState.mailbox.length === 0) {
        container.innerHTML = '<div class="empty-message">暂无邮件</div>';
        return;
      }

      container.innerHTML = '';
      gameState.mailbox.forEach(mail => {
        const mailElement = document.createElement('div');
        mailElement.className = `mail-item ${mail.read ? '' : 'mail-unread'}`;
        mailElement.innerHTML = `
          <div class="mail-header">
            <span class="mail-title">${mail.title}</span>
            <span class="mail-time">${formatTime(mail.timestamp)}</span>
          </div>
        `;
        mailElement.onclick = () => toggleMailContent(mail.id);
        container.appendChild(mailElement);
      });
    }

    // 切换邮件内容
    let selectedMailId = null;
    function toggleMailContent(mailId) {
      const mail = gameState.mailbox.find(m => m.id === mailId);
      if (!mail) return;

      mail.read = true;
      selectedMailId = selectedMailId === mailId ? null : mailId;

      updateMailbox();

      if (selectedMailId === mailId) {
        const mailElement = document.querySelector(`.mail-item:nth-child(${gameState.mailbox.findIndex(m => m.id === mailId) + 1})`);
        if (mailElement) {
          const contentDiv = document.createElement('div');
          contentDiv.className = 'mail-content';
          contentDiv.textContent = mail.content;
          mailElement.appendChild(contentDiv);
        }
      }
    }

    // 更新日志
    function updateLogs() {
      const container = document.getElementById('logs-container');
      container.innerHTML = '';

      // 倒序显示日志
      [...gameState.logs].reverse().forEach(log => {
        const logElement = document.createElement('div');
        logElement.className = 'log-item';
        logElement.textContent = log;
        container.appendChild(logElement);
      });
    }

    // 格式化时间
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    // 添加日志
    function addLog(log) {
      gameState.logs.push(log);
      updateUI();
    }

    // 添加邮件
    function addMail(title, content) {
      const mail = {
        id: Date.now(),
        title,
        content,
        timestamp: Date.now(),
        read: false
      };
      gameState.mailbox.push(mail);
      updateUI();
    }

    // 下一回合
    function handleNextTick() {
      gameState.tickCount++;
      addLog(`第 ${gameState.tickCount} 回合开始`);

      // 处理弟子状态
      gameState.disciples.forEach(disciple => {
        switch (disciple.state) {
          case 'WORKING':
            // 工作产出灵石
            gameState.resources.spiritStones += GAME_CONFIG.DISCIPLE_WORK_OUTPUT.spiritStones;
            // 工作降低心情
            disciple.mood = Math.max(0, disciple.mood - GAME_CONFIG.DISCIPLE_WORK_OUTPUT.moodDecrease);
            break;
          case 'EXPLORING':
            // 历练结束后返回
            disciple.state = 'IDLE';
            disciple.mood = Math.min(100, disciple.mood + GAME_CONFIG.EXPLORATION.MOOD_INCREASE);
            // 获得历练奖励
            const reward = Math.floor(Math.random() * (GAME_CONFIG.EXPLORATION.SPIRIT_STONES_REWARD[1] - GAME_CONFIG.EXPLORATION.SPIRIT_STONES_REWARD[0] + 1)) + GAME_CONFIG.EXPLORATION.SPIRIT_STONES_REWARD[0];
            gameState.resources.spiritStones += reward;
            addLog(`${disciple.name} 历练归来，获得 ${reward} 灵石！`);
            
            // 生成历练故事
            generateExploreStory(disciple.name);
            break;
        }

        // 检查心情是否过低导致走火入魔
        if (disciple.mood < GAME_CONFIG.MOOD_THRESHOLDS.DERANGED && disciple.state !== 'DERANGED') {
          disciple.state = 'DERANGED';
          addLog(`${disciple.name} 心情低落，走火入魔了！`);
        }
      });

      // 检查资源平衡
      if (gameState.resources.spiritStones > 500) {
        // 灵石过多，可以转化为气运
        const convertAmount = Math.min(gameState.resources.spiritStones - 500, 100);
        gameState.resources.spiritStones -= convertAmount;
        gameState.resources.fate += Math.floor(convertAmount / 10);
        addLog(`将 ${convertAmount} 灵石转化为 ${Math.floor(convertAmount / 10)} 气运`);
      }

      // 生成随机故事（每10回合）
      if (gameState.tickCount % 10 === 0) {
        generateRandomStory();
      }

      updateUI();
    }

    // 掌门修行
    function handleLeaderCultivate() {
      if (gameState.resources.fate < GAME_CONFIG.LEADER_CULTIVATE_COST.fate) {
        addLog('气运不足，无法修行！');
        return;
      }

      // 消耗气运
      gameState.resources.fate -= GAME_CONFIG.LEADER_CULTIVATE_COST.fate;
      
      // 增加修为
      gameState.leader.xp += GAME_CONFIG.LEADER_CULTIVATE_GAIN.xp;
      
      addLog(`${gameState.leader.name} 消耗 ${GAME_CONFIG.LEADER_CULTIVATE_COST.fate} 气运修行，获得 ${GAME_CONFIG.LEADER_CULTIVATE_GAIN.xp} 修为！`);

      // 检查是否突破境界
      if (gameState.leader.xp >= gameState.leader.maxXp) {
        const currentRealmIndex = REALMS.indexOf(gameState.leader.realm);
        if (currentRealmIndex < REALMS.length - 1) {
          gameState.leader.realm = REALMS[currentRealmIndex + 1];
          gameState.leader.xp = 0;
          gameState.leader.maxXp = Math.floor(gameState.leader.maxXp * 1.5);
          addLog(`${gameState.leader.name} 突破到 ${gameState.leader.realm}！`);
        } else {
          gameState.leader.xp = gameState.leader.maxXp;
          addLog(`${gameState.leader.name} 已达到最高境界！`);
        }
      }

      updateUI();
    }

    // 分配弟子工作
    function handleAssignWork(discipleId) {
      const disciple = gameState.disciples.find(d => d.id === discipleId);
      if (disciple) {
        disciple.state = 'WORKING';
        addLog(`${disciple.name} 开始工作`);
        updateUI();
      }
    }

    // 派遣弟子历练
    function handleSendExplore(discipleId) {
      const disciple = gameState.disciples.find(d => d.id === discipleId);
      if (disciple) {
        disciple.state = 'EXPLORING';
        addLog(`${disciple.name} 开始历练`);
        updateUI();
      }
    }

    // 重新开始游戏
    function handleStartGame() {
      if (confirm('确定要重新开始游戏吗？当前进度将丢失！')) {
        gameState = {
          tickCount: 0,
          resources: { ...GAME_CONFIG.INITIAL_RESOURCES },
          leader: { ...GAME_CONFIG.INITIAL_LEADER },
          disciples: [],
          mailbox: [],
          logs: ['宗门建立，开始修仙之旅！']
        };
        initDisciples();
        updateUI();
      }
    }

    // 生成随机故事
    function generateRandomStory() {
      const stories = [

      const stories = [
        `${discipleName}在历练途中遇到了一位受伤的老者，出手相救。没想到老者竟是一位隐世高手，传授了他一套上乘的剑法。${discipleName}感激不尽，承诺日后定会回报。`,
        `${discipleName}深入深山历练，意外发现了一个古老的洞府。在洞府中，他找到了一些珍贵的灵草和一本修炼心得。虽然遇到了一些危险，但最终满载而归。`,
